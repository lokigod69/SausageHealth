name: Validate foundation
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'design/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'design/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: sausagehealth_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SH_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/sausagehealth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: docker build -t sausage-health:ci .
      - run: python tests/container_smoke.py sausage-health:ci
