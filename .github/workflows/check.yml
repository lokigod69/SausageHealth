name: Validate foundation
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'design/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'design/**'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: docker build -t sausage-health:ci .
      - run: python tests/container_smoke.py sausage-health:ci
